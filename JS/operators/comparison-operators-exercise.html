    <title>Comparison Operators Exercise</title>
  </head>
  <body>
    <script>
      let x = 10;
      let y = "10";
      document.write("x == y :" + (x == y) + "<br>");
      document.write("x===y" + (x === y) + "<br>");
      x = 5;
      y = 3;
      document.write("x > y:" + (x > y) + "<br>");
      document.write("x < :" + (x < y) + "<br>");
      document.write("x >= y:" + (x >= y) + "<br>");
      document.write("x != y:" + (x != y) + "<br>");
      let a = 7;
      let b = 10;
      console.log(a <= b);
      console.log(a === b);
    </script>
