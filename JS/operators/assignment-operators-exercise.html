<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Operators Exercise</title>
  </head>
  <body>
    <script>
      let x = 10;
      x += 5; //same as x=x+5;
      document.write("After x+=5: " + x + "<br>");

      x -= 3; //same as x=x-3;
      document.write("After x-=3: " + x + "<br>");

      x *= 2; //same as x=x*2;
      document.write("After x*=2: " + x + "<br>");

      x /= 4; //same as x=x/4;
      document.write("After x/=4: " + x + "<br>");

      x %= 3; //same as x=x%3;
      document.write("After x%=3: " + x + "<br>");

      x = 100;
      x -= 20;
      document.write("After x-=20 : " + x + "<br>");
      x *= 2;
      document.write("After x*=2 : " + x + "<br>");
      x /= 4;
      document.write("After x/=4 : " + x + "<br>");
    </script>
  </body>
</html>
