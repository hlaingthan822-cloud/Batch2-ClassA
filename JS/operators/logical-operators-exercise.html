<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logical Operators Exercise</title>
  </head>
  <body>
    <script>
      let isStudent = true;
      let hasCard = false;
      document.write("IsStudent && hasCard " + (isStudent && hasCard) + "<br>");
      document.write("IsStudent || hasCard " + (isStudent || hasCard) + "<br>");
      document.write("!IsStudent " + !isStudent + "<br>");

      let x = 10;
      let y = 5;
      document.write("(x>5) && (y<10) " + (x > 5) && (y < 10) + "<br>");
      document.write("(x>5) || (y<10) " + (x > 5) || (y < 10) + "<br>");
      document.write("!(x==10) " + !(x == 10) + "<br>");
    </script>
  </body>
</html>
