<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript Operators exercise</title>
  </head>
  <body>
    <script>
      let a = 20;
      let b = 4;
      document.write("a+b: " + (a + b) + "<br>");//24
      document.write("a-b: " + (a - b) + "<br>");//16
      document.write("a*b: " + a * b + "<br>");//80
      document.write("a/b: " + a / b + "<br>");//5
      document.write("a%b: " + (a % b) + "<br>");//0

      let num = 5;
      num++;
      document.write("The value of num is " + num + "<br>");
      num--;
      document.write("The value of num is " + num + "<br>");
    </script>
  </body>
</html>
