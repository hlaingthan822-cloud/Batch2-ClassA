<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arithmetic Operators</title>
  </head>
  <body>
    <script>
      let a = 9;
      let b = 8;
      document.write("The result of a+b is " + (a + b) + "<br>");
      document.write("The result of a+b is " + (a - b) + "<br>");
      document.write("The result of a+b is " + a * b + "<br>");
      document.write("The result of a+b is " + a / b + "<br>");
    </script>
  </body>
</html>
