<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
        <button id="clickcount">Click Me</button>
        <p>You clicked <span id="count">0</span>times.</p>
        <script>
            const btn=document.getElementById("clickcount");
            const data=document.getElementById("count");
            let count=0;
            btn.addEventListener("click",function(){
            count++;
            data.textContent=count;    
            });
        </script>
    </script>
</body>
</html>
