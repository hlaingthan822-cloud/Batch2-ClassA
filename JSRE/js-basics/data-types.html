<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Types</title>
  </head>
  <body>
    <script>
      let num = 12;
      let b = "Apple";
      let c = "2";
      let d = {
        name: "Mg Mg",
        age: 12,
        address: "pyawbwe",
      };
      let e = [3, 5, 7];
      let f = ["Apple", "Banana", "Orange"];
      document.write("Num datatype:" + typeof num + "<br>");
      document.write("b datatype:" + typeof b + "<br>");
      document.write("c datatype:" + typeof c + "<br>");
      document.write("d datatype:" + typeof d + "<br>");
      document.write("e datatype:" + typeof e + "<br>");
      document.write("f datatype:" + typeof f + "<br>");
    </script>
  </body>
</html>
