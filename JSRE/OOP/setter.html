<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Circle {
        constructor(radius) {
          this._radius = radius;
        }
        set area(radius) {
          if (radius > 0) {
            this._radius = radius;
          } else {
            console.log("Radius must be positive");
          }
        }
        get area() {
          return Math.PI * this._radius ** 2;
        }
      }
      const c = new Circle(3);
      c.radius = 5;
      console.log(c.radius);
    </script>
  </body>
</html>
