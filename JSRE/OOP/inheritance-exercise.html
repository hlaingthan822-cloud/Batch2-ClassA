<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Student {
        constructor(name, age) {
          this.name = name;
          this.age = age;
        }
        study() {
          document.write(`${this.name} ${this.age} is studying`);
        }
      }
      class Person extends Student {
        constructor(name, age, grade) {
          super(name, age);
          this.grade = grade;
        }
        info() {
          document.write("Hello Welcome form ...");
        }
      }
      const p1 = new Person("mg mg", 20, "A");
      p1.study();
      p1.info();
    </script>
  </body>
</html>
