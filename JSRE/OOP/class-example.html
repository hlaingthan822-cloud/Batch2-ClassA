<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Car {
        constructor(model, brand) {
          this.model = model;
          this.brand = brand;
        }
        start() {
          console.log(`${this.model} ${this.brand} is starting`);
        }
      }
      const car1 = new Car("t", "susuki");
      car1.start();
      const car2 = new Car("t", "toyota");
      car2.start();
    </script>
  </body>
</html>
