<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Animal {
        speak() {
          console.log("Someone generic sound");
        }
      }
      class Dog extends Animal {
        speak() {
          console.log("Woof");
        }
      }
      class Cat extends Animal {
        speak() {
          console.log("Meow");
        }
      }
      const dog = new Dog();
      dog.speak();
      const cat = new Cat();
      cat.speak();
    </script>
  </body>
</html>
