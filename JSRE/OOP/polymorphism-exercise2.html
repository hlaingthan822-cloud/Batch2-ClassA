<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Payment {
        process(amount) {
          console.log(`Payment Method of ${amount}`);
        }
      }
      class PypalPayment extends Payment {
        process(amount) {
          console.log(`Paypal method: ${amount} with paypal method`);
        }
      }
      class CrytoPayment extends Payment {
        process(amount) {
          console.log(`Paypal Method: ${amount} with crytopayment`);
        }
      }
      class creditPayment extends Payment {
        process(amount) {
          console.log(`Paypal Method: ${amount} with creditpayment`);
        }
      }
      const payments = [
        new PypalPayment(),
        new CrytoPayment(),
        new creditPayment(),
      ];
      payments.forEach((payment) => payment.process(100));
    </script>
  </body>
</html>
