<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      document.write("Example1:Passing a function as a parameter");
      function hello(name) {
        console.log("Hello, " + name + " from Javascript function");
      }
      function greetingUser(callback) {
        console.log("GreetingUser is calling the callback");
        callback("Aung Aung");
      }
      greetingUser(hello);
      //**************************//
      document.write("Example2:Running a function ");
      function createGreeter() {
        console.log("CreateGreeter is running a few function");
        return function () {
          console.log("Hello, from the returned function");
        };
      }
      const creater = createGreeter();
      creater();
      //***************************//
      document.write("Example3:Built-in Higher-order function foreach===");
      const numbers = [1, 2, 3, 4];
      numbers.forEach(function (num, index) {
        console.log("Number is " + num + " and index is " + index);
      });
    </script>
  </body>
</html>
