<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      console.log("Without recursion ");
      console.log(5);
      console.log(4);
      console.log(3);
      console.log(2);
      console.log(1);
      console.log("With recursion");
      function countdown(number) {
        console.log(number);
        if (number > 1) {
          countdown(number - 1);
        }
      }
      countdown(5);
    </script>
  </body>
</html>
