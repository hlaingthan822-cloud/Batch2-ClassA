<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function task() {
        return new Promise((resolve) => {
          setTimeout(() => {
            const user = [{ name: "Ma Ma" }, { age: 12 }];
            resolve(user);
          }, 5000);
        });
      }
      async function result() {
        const result = await task();
        console.log(result);
      }
      result();
    </script>
  </body>
</html>
