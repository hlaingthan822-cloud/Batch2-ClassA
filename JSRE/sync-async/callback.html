<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function FetchData(callback) {
        console.log("Fetching Data....");
        setTimeout(() => {
          const data = { name: "Alice", age: 22 };
          callback(data);
        }, 10000);
      }
      FetchData((result) => {
        console.log("Data Served :" + result);
      });
    </script>
  </body>
</html>
