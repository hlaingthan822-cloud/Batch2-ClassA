<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Nesting Selector</title>
  </head>
  <style>
    div,
    p {
      color: red;
    }
    div p {
      color: green;
    }
  </style>
  <body>
    <div>Div Element</div>
    <p>This is a paragraph.</p>
    <div class="id">
      <p>Hello</p>
    </div>
  </body>
</html>
