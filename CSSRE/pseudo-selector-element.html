<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudeo Selector Element</title>
  </head>
  <style>
    a:hover {
      color: green;
    }
    p:focus {
      font-size: 19px;
      color: rgb(55, 0, 128);
    }
    p::first-letter {
      color: red;
    }
  </style>
  <body>
    <a href="http://www.google.com">Go to Google</a>
    <p>This is a paragraph.</p>
  </body>
</html>
