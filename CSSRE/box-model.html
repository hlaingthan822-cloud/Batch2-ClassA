<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        width: 400px;
            height: 150px;
            padding: 40px;
        border: 5px solid #e67e22;
        border-radius:10px;
        border-color: blue;

padding:12px;

    }
    .content-box{
box-sizing: content-box;
    }
    .border-box{
        box-sizing: border-box;
    }

</style>
<body>
    <div>
    <h2>Content Box</h2>
    <div class="box content-box">
        The box is set to <strong>content-box.</strong><br>
Total width =400px+padding+border.<br>
So,it actually rengers **biggers** than 400px .
    </div>
    <h2>Border-Box</h2>
    <div class="box border-box">
          Total box is set to <strong>border-box<strong>.<br>
                Total width = 400px (fixed).<br>
                Padding + border are included inside,<br>
                 so the content area shrinks.
    </div>
</body>
</html>
