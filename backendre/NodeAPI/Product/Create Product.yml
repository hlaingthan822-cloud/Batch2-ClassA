info:
  name: Create Product
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:4000/api/products
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name":"Chair",
        "price":200000,
        "color":"black"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
